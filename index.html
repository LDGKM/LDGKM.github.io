<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chez Déo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Chez Déo · Deo Gratias Loutou">
<meta property="og:description" content="Portfolio served as a menu in a 3D Alsatian winstub: data analysis, 3D, algorithms.">
<meta property="og:image" content="https://ldgkm.github.io/img/cv-1.jpg">
<meta name="description" content="Chez Déo: the portfolio of Deo Gratias Loutou, served as a menu in a 3D Alsatian winstub.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a 3D winstub fills the screen; the waiter speaks from the bottom-left,
   and the printed menu card sits on the right (a bottom sheet on phones).
   One deliberate look, an Alsatian evening: dark wood, paper menu, kelsch blue. */
:root{
  --night:#1B1410;      /* room in the evening */
  --paper:#F4EBDA;      /* menu card */
  --paper-2:#EADDC4;
  --ink:#2B1F17;
  --muted:#76604F;
  --rule:#CDB89A;
  --kelsch:#2E4C8C;     /* Alsatian kelsch cloth blue */
  --wine:#9C3029;       /* winstub red */
  --brass:#C99640;
  --bubble:#FFF8EC;
  --font-sign:"UnifrakturCook","Old English Text MT",Georgia,serif;
  --font-menu:"Alegreya",Georgia,"Times New Roman",serif;
  --font-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --font-sc:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--font-ui);font-size:16px;line-height:1.5;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
#room{position:fixed;inset:0;width:100%;height:100%;display:block}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* top bar */
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(27,20,16,.86),rgba(27,20,16,0))}
.sign{font-family:var(--font-sign);font-size:2rem;line-height:1;color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.4);margin:0;font-weight:700}
.tag{font-family:var(--font-sc);letter-spacing:.08em;font-size:.82rem;color:var(--rule)}
.bar nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{text-decoration:none;border:1px solid rgba(244,235,218,.45);background:rgba(27,20,16,.55);color:var(--paper);border-radius:999px;padding:6px 13px;font-family:var(--font-sc);font-size:.86rem;letter-spacing:.05em}
.chip:hover{border-color:var(--brass);color:#fff}

/* waiter bubble */
.waiter{position:fixed;z-index:15;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(470px,calc(100% - 32px));background:var(--bubble);color:var(--ink);border-radius:14px 14px 14px 3px;padding:14px 16px 16px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);font-family:var(--font-menu);font-size:1.08rem}
.waiter .who{display:flex;align-items:center;gap:8px;font-family:var(--font-sc);font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.bow{width:22px;height:10px;flex:none}
.waiter p{margin:0;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices button{text-align:left;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;padding:9px 12px;font-family:var(--font-ui);font-weight:500;font-size:1rem}
.choices button:hover{background:var(--ink);color:var(--paper)}
.choices .link{border:0;padding:4px 2px;text-decoration:underline;color:var(--muted);font-size:.92rem}
.choices .link:hover{background:none;color:var(--ink)}

/* menu card */
.card{position:fixed;z-index:16;top:calc(68px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(440px,calc(100% - 32px));background:var(--paper);color:var(--ink);border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  display:flex;flex-direction:column;overflow:hidden;font-family:var(--font-menu)}
.card::before{content:"";position:absolute;inset:8px;border:1px solid var(--rule);pointer-events:none;border-radius:2px}
.card-scroll{overflow-y:auto;padding:26px 28px 28px;flex:1;min-height:0;overscroll-behavior:contain}
.card h2{font-family:var(--font-sign);font-weight:700;font-size:2.2rem;text-align:center;margin:0 0 4px;color:var(--ink)}
.card .sub{text-align:center;font-family:var(--font-sc);letter-spacing:.1em;font-size:.8rem;color:var(--muted);margin:0 0 14px}
.sec{margin:20px 0 6px;text-align:center;font-family:var(--font-sc);font-size:.92rem;letter-spacing:.14em;color:var(--wine);display:flex;align-items:center;gap:10px}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.dish{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 6px;border-radius:3px;color:var(--ink)}
.dish:hover{background:var(--paper-2)}
.dish .n{font-weight:700;font-size:1.08rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.dish .d{display:block;color:var(--muted);font-style:italic;font-size:.97rem;line-height:1.4}
.pick{font-family:var(--font-sc);font-style:normal;font-size:.72rem;letter-spacing:.06em;color:#fff;background:var(--kelsch);padding:1px 7px;border-radius:999px;font-weight:500}
.recipe h3{font-family:var(--font-menu);font-weight:700;font-size:1.6rem;line-height:1.15;margin:4px 0 4px;text-wrap:balance}
.recipe .lede{font-style:italic;color:var(--muted);margin:0 0 10px}
.recipe h4{font-family:var(--font-sc);font-weight:700;font-size:.82rem;letter-spacing:.12em;color:var(--wine);margin:16px 0 4px}
.recipe p{margin:0}
.recipe ul{margin:0;padding-left:1.1em}
.recipe li{margin:4px 0}
.recipe .did{background:var(--paper-2);border-left:3px solid var(--kelsch);padding:10px 12px 10px 14px;border-radius:0 3px 3px 0}
.recipe .did h4{margin-top:0;color:var(--kelsch)}
.ingr{display:flex;flex-wrap:wrap;gap:6px}
.ingr span{font-family:var(--font-ui);font-size:.82rem;border:1px solid var(--rule);border-radius:999px;padding:1px 9px;color:var(--ink)}
.recipe figure{margin:12px 0 0}
.recipe img{width:100%;height:auto;max-width:100%;display:block;border:1px solid var(--rule);border-radius:2px}
.card-foot{display:flex;gap:8px;padding:12px 20px 14px;border-top:1px solid var(--rule);background:var(--paper);flex-wrap:wrap}
.card-foot button,.btn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:7px 12px;font-family:var(--font-ui);font-weight:500;font-size:.95rem;text-decoration:none;display:inline-flex;align-items:center}
.card-foot button:hover,.btn:hover{background:var(--ink);color:var(--paper)}
.card-foot .primary{background:var(--ink);color:var(--paper);margin-left:auto}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:8px 0 0}
.facts dt{font-family:var(--font-sc);font-size:.8rem;letter-spacing:.08em;color:var(--wine);padding-top:3px}
.facts dd{margin:0}
.copyline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyline code{font-family:var(--font-ui);user-select:all;background:var(--paper-2);padding:2px 8px;border-radius:3px}
.demo{margin-top:12px;display:grid;gap:8px}
.demo canvas{width:100%;height:auto;aspect-ratio:4/3;background:#fffaf0;border:1px solid var(--rule);border-radius:2px;touch-action:none;display:block}
.demo textarea{width:100%;min-height:6.5em;font:inherit;font-size:.92rem;padding:8px;border:1px solid var(--rule);border-radius:2px;background:#fffaf0;color:var(--ink)}
.demo .row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3rem;gap:8px;align-items:center;font-family:var(--font-ui);font-size:.9rem}
.demo .barx{height:8px;background:var(--paper-2);border-radius:1px;overflow:hidden}.demo .barx i{display:block;height:100%;background:var(--kelsch)}
.demo .note{font-family:var(--font-ui);font-size:.88rem;color:var(--muted)}
.demo .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.demo select{font:inherit;padding:4px 6px;background:#fffaf0;color:var(--ink);border:1px solid var(--rule)}

/* overlays */
dialog{border:0;padding:0;border-radius:4px;background:var(--paper);color:var(--ink);font-family:var(--font-menu);max-height:calc(100dvh - 24px);width:min(860px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,7,5,.7)}
.dlg-bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:var(--paper-2);border-bottom:1px solid var(--rule);z-index:1}
.dlg-bar h2{font-family:var(--font-sign);font-size:1.8rem;margin:0}
.dlg-bar .grow{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dlg-body{padding:18px 22px 26px}
.dlg-body img{width:100%;height:auto;max-width:100%;display:block;background:#fff;border:1px solid var(--rule)}
.tm-dish{border-top:1px solid var(--rule);padding:14px 0}
.tm-dish h3{margin:0 0 2px;font-size:1.3rem}
.load{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-menu);font-style:italic;color:var(--rule);z-index:5;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:760px){
  .sign{font-size:1.5rem}.tag{display:none}
  .bar{flex-wrap:nowrap;gap:8px}.bar nav{flex-wrap:nowrap;gap:5px}.chip{padding:5px 9px;font-size:.78rem}
  .card{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;height:min(52dvh,520px);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .card-scroll{padding:20px 18px 20px}
  body.card-open .waiter{bottom:calc(min(52dvh,520px) + 14px + env(safe-area-inset-bottom,0px));font-size:.92rem;line-height:1.35;padding:8px 12px 10px}
  body.card-open .waiter .who{display:none}
  body.card-open .waiter .choices{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<canvas id="room" aria-hidden="true"></canvas>
<div class="load" id="load"></div>

<header class="bar">
  <h1 class="sign">Chez Déo</h1><span class="tag" id="tag"></span>
  <nav aria-label="Site">
    <a class="chip" id="bClassic" href="classic.html"></a>
    <button type="button" class="chip" id="bCV"></button>
    <button type="button" class="chip" id="bLang" lang=""></button>
  </nav>
</header>

<section class="waiter" id="waiter" aria-live="polite">
  <div class="who"><svg class="bow" viewBox="0 0 22 10" aria-hidden="true"><path d="M11 5 1 0v10Zm0 0 10-5v10Z" fill="#2B1F17"/><circle cx="11" cy="5" r="2" fill="#9C3029"/></svg><span id="who">Déo</span></div>
  <p id="say"></p>
  <div class="choices" id="choices"></div>
</section>

<aside class="card" id="card" hidden aria-label="Menu">
  <div class="card-scroll" id="cardScroll"></div>
  <div class="card-foot" id="cardFoot"></div>
</aside>

<dialog id="dlgText" aria-labelledby="tmTitle"><div class="dlg-bar"><h2 id="tmTitle">Chez Déo</h2><div class="grow"><button type="button" class="btn" data-close></button></div></div><div class="dlg-body" id="tmBody"></div></dialog>
<dialog id="dlgCV" aria-labelledby="cvTitle"><div class="dlg-bar"><h2 id="cvTitle">CV</h2><div class="grow"><a class="btn" id="cvDl" href="cv/Deo_Gratias_Loutou_CV.pdf" download></a><button type="button" class="btn" data-close></button></div></div><div class="dlg-body"><img id="cvImg" src="img/cv-1.jpg" width="910" height="1287" alt="" loading="lazy"></div></dialog>

<script src="content.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
"use strict";
const C = window.CONTENT;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

let lang = store.get("chezdeo-lang") || ((navigator.language||"en").toLowerCase().startsWith("fr") ? "fr" : "en");
let profile = null;            // data | dev | curious
let view = "welcome";          // welcome | menu | dish | bill
let current = null;            // current dish id
let lastSay = () => T().hello;
const T = () => C.ui[lang];
const L = d => d[lang];
const ALL = [C.starter, ...C.dishes];
const XS = {
  fr:{ narr:"Chez Déo · rue des Données", street:"Un soir d'octobre à Mulhouse. La winstub est éclairée et il reste une table. Cliquez sur la porte pour entrer.",
       enter:"Entrer", skipTable:"M'installer directement à table", classic:"Version classique, sans 3D", classicChip:"Version classique",
       inside:"Il fait bon à l'intérieur. L'accueil est juste à votre gauche, on vous attend.", toDesk:"Aller à l'accueil",
       follow:"Parfait. Suivez-moi, je vous installe.", coming:"Très bon choix. Je vous apporte ça tout de suite.",
       seated:"Installez-vous. Avant de vous apporter la carte : qu'est-ce qui vous amène ce soir ?", waiter:"Déo · votre serveur",
       bill:"Voici l'addition. Elle est offerte : il ne vous reste qu'à m'écrire." },
  en:{ narr:"Chez Déo · Data Street", street:"An October evening in Mulhouse. The winstub's lights are on and there's one table left. Click the door to go in.",
       enter:"Go in", skipTable:"Take me straight to a table", classic:"Classic version, no 3D", classicChip:"Classic version",
       inside:"It's warm inside. The front desk is just to your left, they're expecting you.", toDesk:"Go to the front desk",
       follow:"Perfect. Follow me, I'll show you to your table.", coming:"Good choice. I'll bring it right out.",
       seated:"Have a seat. Before I bring the menu: what brings you here tonight?", waiter:"Deo · your waiter",
       bill:"Here's the bill. It's on the house: all you have to do is write to me." }
};
const X = () => XS[lang];

/* ================================================================ UI */
function chrome(){
  document.documentElement.lang = lang;
  $("#tag").textContent = T().tagline;
  $("#bClassic").textContent = X().classicChip;
  $("#bCV").textContent = T().cv;
  $("#bLang").textContent = T().lang; $("#bLang").setAttribute("lang", T().langCode);
  $("#who").textContent = (view === "street" || view === "inside" || view === "entering") ? X().narr : X().waiter;
  document.querySelectorAll("[data-close]").forEach(b => b.textContent = T().close);
  $("#cvDl").textContent = T().download;
  $("#cvImg").alt = lang === "fr" ? "CV d'une page de Deo Gratias Loutou." : "One-page CV of Deo Gratias Loutou.";
}
function say(fn){ lastSay = fn; $("#say").textContent = fn(); $("#waiter").hidden = false; }

function hideCard(){ document.body.classList.remove("card-open"); $("#card").hidden = true; }
function setView(v){ view = v; chrome(); }
const classicLink = () => `<a class="link" href="classic.html">${esc(X().classic)}</a>`;
function street(){
  setView("street"); hideCard(); Scene.toStreet(); Scene.setHot(["door"]);
  say(() => X().street);
  $("#choices").innerHTML = `<button type="button" data-act="enter">${esc(X().enter)}</button><button type="button" data-act="sit">${esc(X().skipTable)}</button>` + classicLink();
}
function enterResto(){
  if (view !== "street") return;
  setView("entering"); Scene.setHot([]); $("#choices").innerHTML = ""; $("#waiter").hidden = true;
  Scene.enter(inside);
}
function inside(){
  setView("inside"); Scene.setHot(["desk"]);
  say(() => X().inside);
  $("#choices").innerHTML = `<button type="button" data-act="desk">${esc(X().toDesk)}</button>`;
}
function goDesk(){
  if (view !== "inside") return;
  setView("walking"); Scene.setHot([]); $("#choices").innerHTML = ""; $("#waiter").hidden = true;
  Scene.toDesk(welcome);
}
function welcome(){
  setView("welcome"); hideCard(); Scene.setHot([]);
  say(() => Scene.seated ? X().seated : T().hello);
  $("#choices").innerHTML = T().choices.map(([k,l]) => `<button type="button" data-profile="${k}">${esc(l)}</button>`).join("") + classicLink();
}
function sitDown(){ Scene.sitNow(); welcome(); }
$("#choices").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a){ const act = a.dataset.act; if (act === "enter") enterResto(); else if (act === "sit") sitDown(); else if (act === "desk") goDesk(); return; }
  const b = e.target.closest("[data-profile]"); if (!b) return;
  profile = b.dataset.profile; store.set("chezdeo-profile", profile);
  if (Scene.seated) return showMenu(true);
  setView("leading"); $("#choices").innerHTML = ""; say(() => X().follow);
  Scene.lead(() => showMenu(true));
});

function ordered(){
  const mains = C.dishes.filter(d => d.section === "mains");
  const p = profile || "curious";
  return mains.slice().sort((a,b) => (b.picks.includes(p)) - (a.picks.includes(p)));
}
function dishBtn(d){
  const pick = profile && d.picks.includes(profile) ? `<span class="pick">${esc(T().recommended)}</span>` : "";
  return `<button type="button" class="dish" data-dish="${d.id}"><span class="n">${esc(L(d).name)} ${pick}</span><span class="d">${esc(L(d).desc)}</span></button>`;
}
function showMenu(first){
  setView("menu"); current = null; waitLine = null;
  const S = T().sections;
  const special = C.dishes.filter(d => d.section === "special"), dessert = C.dishes.filter(d => d.section === "dessert");
  $("#cardScroll").innerHTML = `<h2>${esc(T().menuTitle)}</h2><p class="sub">${esc(T().tagline)}</p>
    <div class="sec">${esc(S.starter)}</div>${dishBtn(C.starter)}
    <div class="sec">${esc(S.special)}</div>${special.map(dishBtn).join("")}
    <div class="sec">${esc(S.mains)}</div>${ordered().map(dishBtn).join("")}
    <div class="sec">${esc(S.dessert)}</div>${dessert.map(dishBtn).join("")}
    <div class="sec">${esc(S.bill)}</div><button type="button" class="dish" data-bill><span class="n">${esc(T().billTitle)}</span><span class="d">${esc(T().billIntro)}</span></button>`;
  $("#cardFoot").innerHTML = "";
  $("#cardFoot").hidden = true;
  $("#card").hidden = false; document.body.classList.add("card-open"); $("#cardScroll").scrollTop = 0;
  $("#choices").innerHTML = "";
  say(() => profile ? T().profileLine[profile] : T().hello);
  Scene.go("table");
  if (first) $("#cardScroll").focus?.();
}
$("#cardScroll").addEventListener("click", e => {
  const d = e.target.closest("[data-dish]"); if (d) return openDish(d.dataset.dish);
  if (e.target.closest("[data-bill]")) return openBill();
  if (e.target.closest("[data-try]")) return toggleDemo();
  const cp = e.target.closest("[data-copy]"); if (cp) copyMail(cp);
  if (e.target.closest("[data-seecv]")) openCV();
});

function sequence(){ return [C.starter, ...C.dishes.filter(d => d.section==="special"), ...ordered(), ...C.dishes.filter(d => d.section==="dessert")]; }
function openDish(id){
  const d = ALL.find(x => x.id === id); if (!d) return;
  setView("dish"); current = id; const t = L(d), R = T().recipe;
  let body;
  if (d === C.starter){
    body = `<p class="sub">${esc(T().sections.starter)}</p><h3>${esc(t.name)}</h3><p class="lede">${esc(t.desc)}</p>
      <dl class="facts">${t.lines.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;
  } else {
    body = `<p class="sub">${esc(T().sections[d.section])}${profile && d.picks.includes(profile) ? " · " + esc(T().recommended) : ""}</p>
      <h3>${esc(t.name)}</h3><p class="lede">${esc(t.desc)}</p>
      <h4>${esc(R.problem)}</h4><p>${esc(t.problem)}</p>
      <div class="did"><h4>${esc(R.did)}</h4><ul>${t.did.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
      <h4>${esc(R.result)}</h4><p>${esc(t.result)}</p>
      <h4>${esc(R.team)}</h4><p>${esc(t.team)}</p>
      <h4>${esc(R.tools)}</h4><div class="ingr">${d.tools.map(x => `<span>${esc(x)}</span>`).join("")}</div>
      ${d.demo ? `<div class="demo" id="demoBox" hidden></div>` : ""}
      ${(d.images||[]).map(src => `<figure><img src="img/${src}" alt="${esc(t.name)}" loading="lazy"></figure>`).join("")}`;
  }
  $("#cardScroll").innerHTML = `<div class="recipe">${body}</div>`;
  const seq = sequence(), i = seq.findIndex(x => x.id === id), nxt = seq[i+1];
  $("#cardFoot").hidden = false;

    if (walk) walkUpdate(dt); else { camPos.lerp(goalPos, k); camLook.lerp(goalLook, k); }
    const rg = region(); off.x += (rg.dx - off.x)*k; off.y += (rg.dy - off.y)*k; cam.setViewOffset(innerWidth, innerHeight, -off.x, -off.y, innerWidth, innerHeight);
    cam.position.set(camPos.x + mouse.x*0.06, camPos.y - mouse.y*0.03 + bob, camPos.z); cam.lookAt(camLook);
    waiterUpdate(dt); tweenUpdate(dt);
    const kd = waiter.root.visible && Math.hypot(waiter.pos.x - K_IN[0], waiter.pos.z - K_IN[1]) < 1.2 ? 1 : 0;
    kDoor.userData.t += (kd - kDoor.userData.t)*Math.min(1, dt*8); kDoor.rotation.y = 1.25*kDoor.userData.t;
    fT += (fGoal - fT)*(reduced ? 1 : Math.min(1, dt*3)); fDoors.forEach(p => p.rotation.y = p.userData.sg*1.35*fT);
    if (onTable && onTable.food && onTable.food.userData.update) onTable.food.userData.update(now, dt);
    R.render(scene, cam);
    requestAnimationFrame(frame);
  }
  function start(){
    try { build(); } catch(e){ console.error(e); return false; }
    if (document.fonts && document.fonts.load) Promise.all(["700 40px UnifrakturCook","20px Alegreya","italic 20px Alegreya","500 20px 'Alegreya Sans SC'"].map(f => document.fonts.load(f))).then(relabel, () => {});

  }
  function relabel(){ signs.forEach(t => t._redraw()); }
  const api = { start, go, serve, toStreet, enter, toDesk, lead, sitNow, relabel, setHot(ids){ hotOn = new Set(ids); },
    needsTrip(kind){ return !(onTable && onTable.kind === kind); }, get seated(){ return seated; }, get ok(){ return ok; }, onHot:null, onReveal:null };
  return api;
})();

function mk(host, w=640, h=480){ const c = document.createElement("canvas"); const r = Math.min(devicePixelRatio,2); c.width=w*r; c.height=h*r; host.append(c); const x = c.getContext("2d"); x.scale(r,r);
  const loc = e => { const b = c.getBoundingClientRect(); return [(e.clientX-b.left)/b.width*w, (e.clientY-b.top)/b.height*h]; }; return {c,x,w,h,loc}; }
function rng(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
const DEMOS = {
  voronoi(host){ const {c,x,w,h,loc} = mk(host,640,460); const info = document.createElement("p"); info.className="note"; host.append(info);
    const R = rng(11), names = ["Au Cerf","Il Forno","Cèdre","Sakura","Pho 68","Le Comptoir","Anatolia","Taj","Winstub Henriette","Bella Napoli","Zen","La Table","Saigon","Brasserie Réunion","Mezzé","Chez Jeannette","Pasta Mia","Le Tilleul","Masala","Le Petit Zinc","Osaka","Byblos","Le Moulin","La Cour"];
    const P = names.map(n => ({n, x:30+R()*(w-60), y:30+R()*(h-60)})); const del = d3.Delaunay.from(P,d=>d.x,d=>d.y), vor = del.voronoi([0,0,w,h]); let me=[w/2,h/2];
    const draw = () => { x.clearRect(0,0,w,h); const i = del.find(me[0],me[1]), nb=[...del.neighbors(i)];
      x.fillStyle="rgba(46,76,140,.18)"; x.beginPath(); vor.renderCell(i,x); x.fill(); x.strokeStyle="#CDB89A"; x.beginPath(); vor.render(x); x.stroke();
      x.setLineDash([3,4]); x.strokeStyle="#76604F"; x.beginPath(); nb.forEach(j => { x.moveTo(P[i].x,P[i].y); x.lineTo(P[j].x,P[j].y); }); x.stroke(); x.setLineDash([]);
      P.forEach((p,k) => { x.fillStyle = k===i ? "#2E4C8C" : "#2B1F17"; x.beginPath(); x.arc(p.x,p.y,k===i?6:3.5,0,7); x.fill(); });
      x.strokeStyle="#9C3029"; x.lineWidth=2; x.beginPath(); x.moveTo(me[0]-7,me[1]); x.lineTo(me[0]+7,me[1]); x.moveTo(me[0],me[1]-7); x.lineTo(me[0],me[1]+7); x.stroke(); x.lineWidth=1;
      info.textContent = (lang==="fr" ? "Le plus proche : " : "Closest: ") + P[i].n + (lang==="fr" ? " · alternatives : " : " · alternatives: ") + nb.slice(0,3).map(j=>P[j].n).join(", "); };
    c.addEventListener("pointerdown", e => { me = loc(e); draw(); c.setPointerCapture(e.pointerId); }); c.addEventListener("pointermove", e => { if (e.buttons){ me = loc(e); draw(); } }); draw(); },
  kmeans(host){ const {c,x,w,h} = mk(host,640,440); const ctl = document.createElement("div"); ctl.className="ctl";
    ctl.innerHTML = `<label class="note" for="kk">k</label><select id="kk"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><button type="button" class="btn" id="ks">${lang==="fr"?"Une étape":"Step"}</button><button type="button" class="btn" id="kn">${lang==="fr"?"Nouvelles données":"New data"}</button><span class="note" id="ki"></span>`; host.append(ctl);
    const PAL=["#C9714A","#2E4C8C","#6E8B3D","#C99640","#8A4F9E"]; let seed=3, pts=[], cen=[], it=0;
    const data = () => { const R=rng(seed++); pts=[]; const B=[0,1,2,3].map(()=>[80+R()*(w-160),70+R()*(h-140),25+R()*40]); for (let i=0;i<320;i++){ const b=B[i%4]; pts.push([b[0]+(R()+R()+R()-1.5)*b[2]*1.6, b[1]+(R()+R()+R()-1.5)*b[2]*1.6]); } reset(); };
    const reset = () => { const k=+ctl.querySelector("#kk").value, R=rng(seed*7); cen=Array.from({length:k},()=>pts[(R()*pts.length)|0].slice()); it=0; draw(); };
    const asg = () => pts.map(p => { let b=0,bd=1e9; cen.forEach((c,j)=>{ const d=(p[0]-c[0])**2+(p[1]-c[1])**2; if(d<bd){bd=d;b=j;} }); return b; });
    const step = () => { const a=asg(), s=cen.map(()=>[0,0,0]); pts.forEach((p,i)=>{ s[a[i]][0]+=p[0]; s[a[i]][1]+=p[1]; s[a[i]][2]++; }); cen=cen.map((c,j)=>s[j][2]?[s[j][0]/s[j][2],s[j][1]/s[j][2]]:c); it++; draw(); };
    const draw = () => { x.clearRect(0,0,w,h); const a=asg(); pts.forEach((p,i)=>{ x.fillStyle=PAL[a[i]]; x.beginPath(); x.arc(p[0],p[1],2.8,0,7); x.fill(); });
      cen.forEach((c,j)=>{ x.fillStyle=PAL[j]; x.strokeStyle="#2B1F17"; x.lineWidth=2; x.beginPath(); x.rect(c[0]-6,c[1]-6,12,12); x.fill(); x.stroke(); }); ctl.querySelector("#ki").textContent = (lang==="fr"?"itération ":"iteration ") + it; };
    ctl.querySelector("#ks").onclick = step; ctl.querySelector("#kn").onclick = data; ctl.querySelector("#kk").onchange = reset; data(); },

    const words = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
    const grams = a => new Set(a.slice(0,-2).map((_,i)=>a[i]+" "+a[i+1]+" "+a[i+2])); const jac=(a,b)=>{ const i=[...a].filter(v=>b.has(v)).length, u=new Set([...a,...b]).size; return u?i/u:0; };
    const run = () => { const wa=words(host.querySelector("#pa").value), wb=words(host.querySelector("#pb").value), ga=grams(wa), gb=grams(wb);
      const rows = [[lang==="fr"?"Vocabulaire commun":"Shared vocabulary", jac(new Set(wa),new Set(wb))],[lang==="fr"?"Phrases communes":"Shared phrases", jac(ga,gb)],[lang==="fr"?"Score de plagiat":"Plagiarism score", gb.size?[...gb].filter(v=>ga.has(v)).length/gb.size:0]];
      host.querySelector("#pm").innerHTML = rows.map(([k,v]) => `<div class="row"><span>${k}</span><span class="barx"><i style="width:${(v*100).toFixed(0)}%"></i></span><span>${(v*100).toFixed(0)} %</span></div>`).join(""); };
    host.addEventListener("input", run); run(); },
  life(host){ const W=56,H=40,S=10; const {c,x,w,h,loc} = mk(host,W*S,H*S); let g = new Uint8Array(W*H).map(()=>Math.random()<0.25?1:0), run=!reduced;
    const ctl = document.createElement("div"); ctl.className="ctl"; ctl.innerHTML = `<button type="button" class="btn" id="lp">${run?(lang==="fr"?"Pause":"Pause"):(lang==="fr"?"Lancer":"Start")}</button><span class="note">${lang==="fr"?"Cliquez pour ajouter des cellules.":"Click to add cells."}</span>`; host.append(ctl);
    const draw = () => { x.clearRect(0,0,w,h); x.fillStyle="#2B1F17"; for (let i=0;i<W*H;i++) if (g[i]) x.fillRect((i%W)*S+1,((i/W)|0)*S+1,S-2,S-2); };
    const next = () => { const n=new Uint8Array(W*H); for (let y=0;y<H;y++) for (let xx=0;xx<W;xx++){ let s=0; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) if (dx||dy) s+=g[((y+dy+H)%H)*W+(xx+dx+W)%W]; const a=g[y*W+xx]; n[y*W+xx]=(a&&(s===2||s===3))||(!a&&s===3)?1:0; } g=n; draw(); };
    let tm = run ? setInterval(next,100) : 0; ctl.querySelector("#lp").onclick = e => { run=!run; clearInterval(tm); if (run) tm=setInterval(next,100); e.target.textContent = run ? "Pause" : (lang==="fr"?"Lancer":"Start"); };
    c.addEventListener("pointerdown", e => { const [a,b]=loc(e); const i=((b/S)|0)*W+((a/S)|0); g[i]=1-g[i]; draw(); }); draw(); },
};
